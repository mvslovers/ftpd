name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: mvslovers/mbt/.github/workflows/release3.yml@main
    permissions:
      contents: write

  # mbt's release3.yml publishes the release page with the SMP package and
  # nothing else, and it replaces an existing release of the same tag. The
  # books (ML06-0001, ML06-0002) and SHA256SUMS are attached here, so a release
  # cannot be left without them; the last step fails the run if any asset the
  # release must carry is missing. Re-running the job is safe (--clobber).
  books:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/install-typst

      # The Makefile fixes the PDF creation date at 0, so the build does not
      # depend on the clock or on SOURCE_DATE_EPOCH.
      - name: Build the manuals
        run: make -C docs/books

      # SHA256SUMS describes the files as published: the SMP files are
      # downloaded from the release, not rebuilt.
      - name: Attach the manuals and SHA256SUMS
        run: |
          mkdir out
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p 'ftpd-*' -D out
          cp docs/books/ml06-0001-*.pdf docs/books/ml06-0002-*.pdf out/
          (cd out && sha256sum * > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            out/ml06-0001-*.pdf out/ml06-0002-*.pdf SHA256SUMS

      - name: Check the assets of the release
        run: tools/check-release-assets.sh "$GITHUB_REF_NAME"
