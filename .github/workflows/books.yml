# The FTPD manuals, ML06-0001 and ML06-0002 (docs/books), built with typst on
# every PR and push to main, so a broken reference, label or syntax error
# fails the change that made it. typst is pinned by version AND sha256 in
# .github/actions/install-typst, the fonts come from the bookmaster submodule.
# The PDFs are kept as the artifact `books`.
name: books

on:
  pull_request:
  push:
    branches: [main]

jobs:
  books:
    name: manuals (typst)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: ./.github/actions/install-typst

      - name: Build the manuals
        run: make -C docs/books

      - uses: actions/upload-artifact@v4
        with:
          name: books
          path: docs/books/*.pdf
          if-no-files-found: error
