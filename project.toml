[project]
name = "ftpd"
version = "1.1.1-dev"
type = "application"

[toolchain]
# Pins the refs release.yml builds the published artifacts against; build.yml
# deliberately keeps floating on main so a cc370/libc370 regression surfaces
# in a PR build (mbt#68). cc370 is omitted -- it defaults to main and has no
# releases to pin to yet.
#
# Without this the release CI builds against libc370 main, which is how the
# first 1.0.0 attempt shipped reporting "FTPD005I LIBC370 1.0.3-DEV (F14AD04)"
# -- an unreleased runtime nobody can reproduce from a tag.
# 1.0.6 or later is REQUIRED, not merely preferred: __fabandon() (#168) and
# the "rlse" fopen mode keyword (#167) arrived in 1.0.5 and would not link
# against 1.0.4, and the ENOSPC reply split (#135) is answering a condition
# only 1.0.6 produces -- on an older runtime that same STOR abends instead.
libc370 = "1.0.6"

[build]
# -DVERSION from the project version (v1's mbt injected it automatically;
# v2 does not). Kept consistent across the ecosystem's projects.
cflags = ["-I", "include", '-DVERSION=\"$(PROJECT_VERSION)\"']

# ── Load module ──────────────────────────────────────────
# FTPD — FTP server STC (threading runtime → crt1, APF-authorized AC(1)).
[[module]]
name = "FTPD"
startup = "crt1"
entry = "@@CRT0"
sources = ["src/ftpd*.c"]
ac = 1                    # APF authorization (SETCODE AC(1)); mbt puts it on
# the link line as '--ac 1' -- the note that this was still pending is stale.
# It matters for the SMP install: the ++JCLIN is a COPY step, so SMP copies the
# module instead of re-binding it, and AC(1) arrives exactly as ld370 set it.

# ── Tests ────────────────────────────────────────────────
# ftpd_adr_parse() -- the shared SRVBIND/PASVBIND/PASVADR parser (#76).
# ftpd#adr.c is free of ftpd.h and of MVS services, so this is DUAL: it runs
# natively via test-host and on MVS via test-mvs.  The helper source is listed
# explicitly for the host link (no autocall there).
[[test]]
name = "TSTADR"
sources = ["test/tstadr.c", "src/ftpd#adr.c"]

# ftpd_dsn_valid() -- the data set name character check (#95).  Same shape as
# TSTADR: ftpd#dsn.c is free of ftpd.h and of MVS services, so this is DUAL.
[[test]]
name = "TSTDSN"
sources = ["test/tstdsn.c", "src/ftpd#dsn.c"]

# ftpdcfg_load() -- a read error on DD:FTPDPRM must abandon the start (#119).
# MVS-only: the vector is a real BSAM wrong-length record, built here by
# allocating the same data set through two DDs that disagree about BLKSIZE,
# so there is nothing on the host to run it against.  ftpd#log.c comes along
# because ftpd#cfg.c logs; it needs no GRT anchor (logst() answers NULL and
# the callers fall back), so no main() is required.
#
# parm names the scratch data set the test creates and deletes.  mbt passes
# it to the program verbatim -- there is no $(MBT_MVS_HLQ) expansion here the
# way [build] cflags gets $(PROJECT_VERSION) -- so the HLQ is written out.
# Change it when running against a system where IBMUSER is not the runner --
# and keep it short: mbt puts parm on the EXEC card without wrapping, and a
# name long enough to push that card past column 71 produces JCL that fails
# with IEF629I INCORRECT USE OF APOSTROPHE instead of running the test.
[[test]]
name = "TSTPRM"
host = false
parm = "IBMUSER.FTPD.TPRM"
sources = ["test/tstprm.c", "src/ftpd#cfg.c", "src/ftpd#log.c",
           "src/ftpd#adr.c"]

# ── Dependencies ─────────────────────────────────────────
# Only ufsd remains a real dependency: libufs.h / libufs.a are ufsd-specific.
# crent370 was dropped -- every crent370 header ftpd uses (clib*.h, racf.h,
# mvssupa.h, haspjqe.h, socket.h, ...) and its runtime routines are now in
# the cc370 sysroot (libc370), same as the ufsd v2 migration.
[dependencies]
"mvslovers/ufsd" = ">=1.3.0"

# ── Deploy (make deploy, the inner loop) ─────────────────
# Where `make deploy` RECEIVEs the LINKLIB XMIT. Without this it would derive
# a versioned name from the HLQ and the version -- IBMUSER.FTPD.V1R1M1D.LINKLIB
# today -- which moves with every bump and leaves the previous one catalogued,
# the same churn #121 took out of the release data sets. One stable name means
# the STC procedure's STEPLIB can point at it once.
#
# NOT the installed library. FTPD.LINKLIB is what SMP installs into and what
# IEAAPF00 authorises; this one is the development target and deliberately
# separate, so a deploy cannot overwrite an installed release. It is also not
# APF-authorised, so a module deployed here is fetched key 8 and authorises
# itself through SVC 244 instead -- which means the AC(1) module-data trap
# (#101) does not fire on it. Test that from FTPD.LINKLIB, not from here.

[deploy]
target = "FTPD.DEV.LINKLIB"

# ── Distribution (SMP4 install package) ──────────────────
# Turns `make package` into an installable product, the same two transports
# ufsd ships with:
#
#   FTPD load module -> XMIT -> staging LKLIB -> SMP ++MOD -> FTPD.LINKLIB
#   samplib/         -> XMIT -> TSO RECEIVE            -> FTPD.SAMPLIB
#
# SMP *copies* the host-bound module rather than re-binding it (a COPY-style
# ++JCLIN is what says so), which is what keeps ac = 1 and the entry point
# exactly as ld370 set them. The sample library stays outside SMP: an MCS card
# ends at column 72 and FTPDPRM0 already has comment lines past it, so a
# configuration pattern would have to answer to a delivery mechanism.
#
# Every value is a dataset name; the ddname SMP addresses it by is always the
# last qualifier, so LINKLIB, SAMPLIB, FTPDLOAD and AFTPDLOD fall out of the
# names.
#
# THE NAMES CARRY NO VERSION (#121), and that inverts how an upgrade works.
# They used to expand @VRM@ to the *patch* level -- FTPD.V1R0M2.LINKLIB for
# 1.0.2 -- while the FMID moved per minor, so two releases never collided on
# their libraries, only on the FMID. That is why a patch install needed UCLIN
# to free the id, and why the uninstall job's DELETE step was a trap: it named
# the PREDECESSOR's datasets, and running it scratched libraries nobody was
# using while the live installation stood untouched, with SMP reporting
# accepted throughout.
#
# With one set of names there is one installation, and the two can no longer
# drift apart. The cost is that the libraries now DO collide: the alloc job is
# IEFBR14 with DISP=(NEW,CATLG,DELETE) and will not run twice, so an upgrade is
# a clean cut -- RESTORE + REJECT the old FMID, scratch the libraries, allocate,
# install. The template already described that as the way to start over; it is
# now the ordinary path. In exchange the DELETE step means what it says, and
# nobody has to work out which release a dataset name belongs to.
#
# Stop the started task before replacing the load library. It is the one FTPD
# loads from.
[distribution]
readme = "doc/installation.md"

[distribution.smp]
# One FMID per release, spent exactly once: the id *is* the release, not the
# minor level. 1.0.0 through 1.0.2 were TFTP100 (the policy before this one);
# 1.1.0 was TFTP110; this is 1.1.1, so TFTP111. CLAUDE.md carries the rule, including the one that
# constrains versioning itself: a 7-character id has room for three version
# digits, so no component may ever exceed 9 -- ftpd 1.1.10 cannot be expressed
# and must not be released.
#
# `delete` is what makes a successor installable at all. SMP keys element
# ownership on MOD(name) in the CDS, not on the library the element lives in,
# so a SYSMOD that does not own MOD(FTPD) passes it over: "MOD FTPD NOT SEL"
# in one column of one report, nothing copied, and every condition code still
# reading success. Sighted here on 2026-09-13 (FTPDINS JOB00269) -- an empty
# FTPD.LINKLIB after a RECEIVE/APPLY/ACCEPT that was RC 00 from top to bottom.
# With DELETE, SMP deletes the predecessor's LMODs from the target and copies
# the new ones in, and MOD(FTPD) comes back carrying the new FMID. It replaces
# the hand-written UCLIN job that used to be required first (doc/uninstall.md).
#
# Neither key moves on its own: `make release` bumps VERSION and the [project]
# version and nothing else. Set `fmid` to the new id and `delete` to the one it
# replaces *before* every release, or 1.1.1 re-spends TFTP110.
#
# A DELETE of an id the system never had is harmless -- which matters, because
# every 1.1.0 install carries DELETE(TFTP100), including the fresh ones. SMP4
# accepts it and installs normally: measured on mvsdev 2026-09-14 (TTMPINS
# JOB00309) with throwaway id TTMP112 deleting TTMP900, an id absent from both
# zones and from SMPPTS beforehand (TTMPCHK JOB00307). Every step ended COND
# CODE 0000, HMA2380 COPY SUCCESSFUL in the APPLY (TTMPLIB) and again in the
# ACCEPT (ATTMPLOD), and both libraries held the module afterwards (TTMPLST
# JOB00310). That is MVS/CE at HMASMP LVL 04.48; it was not re-run on TK5,
# which carries the same SMP4 level.
#
# Note the APPLY ends RC 00 here, not the RC 04 on HMA2461 that the
# upgrade path produces: with nothing to delete from the target there is no
# missing SMPSCDS backup entry to report. accept_fmid's relaxed ACCEPT gate is
# therefore only load-bearing on an upgrade, and merely harmless on a fresh
# install.
#
# It does leave a tombstone. The deleted id appears in *both* zones afterwards
# as "TYPE = FUNCTION" with "DELBY = <the new fmid>" and nothing else -- so
# after any 1.1.0 install, LIST CDS/ACDS SYSMOD(TFTP100) answers RC 00 with a
# DELBY line rather than RC 04 NOT FOUND, on a system that never ran 1.0.x.
# When checking whether an id is free, read the stanza and not just the RC: a
# bare DELBY is a tombstone, not an install. An uninstall should clear it with
# a plain DEL SYSMOD(<old>) in both zones, which works (TTMPCLN JOB00311 took
# TTMP900 back to NOT FOUND alongside TTMP112).
#
# TFTP111 was verified free before it was claimed here, the same way TFTP110
# and TFTP100 were. LIST CDS and LIST ACDS SYSMOD(TFTP111) both answered "THE
# FOLLOWING SELECTED ENTRIES WERE NOT FOUND" with RC 04 on BOTH stands we can
# reach: mvsdev (MVS/CE, FMIDCHK JOB00332) and drnmig3a (TK5, FTPDCHK JOB00045),
# 2026-09-14. Name the stands, not just "checked" -- a collision can be
# distribution-specific (the E??nnnn note above, and the TMVS/TIST/TJES USERMODs
# that exist on MVS/CE and not on TK5), so one stand cannot establish that an id
# is free. drnmig3a has never carried an SMP-installed FTPD at all -- its
# FTPD.LINKLIB is a hand copy SMP knows nothing about, and TFTP110 is unknown in
# both of its zones too -- so this is a real absence and not an empty system.
#
# Residual: SYS1.SMPPTS was checked for TFTP members on mvsdev only. The PTS
# holds what was RECEIVEd, which a zone LIST does not show, so an id received
# and never applied on drnmig3a would still be missed.
#
# TFTP100 and TFTP110 are both spent and must never be reused. TFTP100 shipped
# with 1.0.0 through 1.0.2. TFTP110 shipped with 1.1.0 on 2026-09-14 -- and
# also with the build that was published and withdrawn the day before, which is
# the same id either way.
#
# A test install must use a throwaway id *and* throwaway module names. The
# ownership rule above is keyed on MOD(name), so a test package carrying the
# real module name fights the real install for that name whatever library it
# installs into. TTMP110 was that id on 2026-09-13 (FTPDINS JOB00269) and is
# spent: received, applied and accepted, then UCLIN'd back out. TTMP111 is
# spent the same way, from the second run that verified the upgrade path
# (FTPDINS JOB00281). TTMP112 and TTMP900 are spent from the fresh-install run
# above (2026-09-14, JOB00307-JOB00311). TFTP110 was verified still NOT FOUND
# in both zones after each (FINALCHK JOB00277, TTMPCLN JOB00283).
fmid = "TFTP111"
delete = ["TFTP110"]            # the level this one replaces -- see above
system = "Z038"

# Empty despite the [dependencies] entry on ufsd, which is a *build* time one:
# libufs is linked statically, so nothing of ufsd has to be installed for FTPD
# to load. At run time it is soft -- ftpd_ufs_get() asks UFSD for a session
# lazily, per session, and answers 550 UFS service not available when the
# started task is not there. MVS data sets and JES are unaffected, which is
# most of what FTPD does. REQ(TUFS120) would therefore refuse the install on
# every system that does not run UFSD, for a facility that degrades on its own
# -- including both systems we test on, where LIST CDS/ACDS SYSMOD(TUFS120)
# answered RC 04 on 2026-08-13. ufsd's own prereq is empty for the same kind of
# reason: RAKF is a runtime dependency, not a SYSMOD one. The guide documents
# UFSD as an optional runtime prerequisite instead.
prereq = []

# Not optional with a DELETE in play: each zone is deleted by its own pass, so
# without the ACCEPT the CDS entry for TFTP100 goes and the ACDS one stays
# behind as REC APP ACC. It also makes this level the base a PTF RESTORE
# returns to, which is what it was here for before.
accept_fmid = true
lklib = "FTPD.FTPDLOAD"         # staging: what the load XMIT is received into
target = "FTPD.LINKLIB"         # where the load module ends up
distlib = "FTPD.AFTPDLOD"

[[distribution.library]]
dir = "samplib"
target = "FTPD.SAMPLIB"

# ── Release ──────────────────────────────────────────────
[release]
version_files = ["VERSION"]
