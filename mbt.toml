schema = 3

[project]
name = "ftpd"
version = "1.3.3-dev"
kind = "application"

[toolchain]
# Pins the refs release.yml builds the published artifacts against; build.yml
# deliberately keeps floating on main so a cc370/libc370 regression surfaces
# in a PR build (mbt#68). The two pins move together: libc370 2.x needs a
# matching cc370, and every libc370 header #errors on one outside its range.
#
# Without this the release CI builds against libc370 main, which is how the
# first 1.0.0 attempt shipped reporting "FTPD005I LIBC370 1.0.3-DEV (F14AD04)"
# -- an unreleased runtime nobody can reproduce from a tag.
# 2.0.0 is REQUIRED: the sources include the 2.0 header tree (mvs/, ext/,
# ibm/, sys/socket.h, ...), which 1.x does not have, and libufs.h from ufsd
# 1.4.0-dev includes 2.0 headers too.
# 2.3.1: the C runtime startup is a member of libc.a from 2.3.0 on,
# so no module names a startup object (mvslovers/mbt#158). An older libc.a
# would quietly link crt0 where these modules used to have crt1. 2.3.1
# rather than 2.3.0 for the subtask cleanup fix (mvslovers/libc370#431).
# 2.4.0: needs cc370 >= 1.4.0 and ships no crt0.o/crt1.o,
# which mbt 2.2.0 no longer asks for.
# 2.6.1 with cc370 1.4.0: the toolchain pair of the mbt 3 migration.
# 2.10.3 with cc370 1.6.1: the pair 1.2.0 ships with. 2.10.3 is the first
# libc370 whose CLOSE of a member that failed with an x37 skips the STOW
# (mvslovers/libc370#524): before it, a STOR into a full PDS emptied the
# member it was replacing. The IBM macros come from maclib370 since 2.8.0.
# 2.24.1 with cc370 1.6.1: every libc370 2.x header accepts cc370 >= 1.6.0, < 2,
# so the cc370 pin stays. 2.24.1 rather than 2.24.0 because from 2.15.0 to
# 2.24.0 the library created its open-file list and the standard streams on
# first use in the caller's storage key; an AC(1) module whose first fopen()
# came inside a key-0 window got them in key-0 storage and abended S0C4 in its
# own key (mvslovers/libc370#693, fixed in 2.24.1). 2.24.0 is also the first
# libc370 whose send() passes at most one 256-byte X'75' segment per call
# (mvslovers/libc370#160), which closes the send side of #137.
# 2.25.1 with cc370 1.6.1: the first libc370 whose thread manager starts a
# worker for a pool of 1 to 3 (mvslovers/libc370#700). Before it, MAXSESSIONS
# below 4 left every connection queued and never served (#168); FTPD no longer
# raises the pool to 4 and creates one worker per allowed session again.
cc370 = "1.6.1"
libc370 = "2.25.1"
mbt = "3.0"

# ── Load module ──────────────────────────────────────────
# FTPD — FTP server STC (APF-authorized AC(1)).
[module.FTPD]
rent = true
reus = true
entry = "@@CRT0"
sources = ["src/ftpd*.c"]
ac = 1                    # APF authorization (SETCODE AC(1)); mbt puts it on
# the link line as '--ac 1' -- the note that this was still pending is stale.
# It matters for the SMP install: the ++JCLIN is a COPY step, so SMP copies the
# module instead of re-binding it, and AC(1) arrives exactly as ld370 set it.

# ── Tests ────────────────────────────────────────────────
# Defaults for every test; test/**/*.c and *.asm are tests unless excluded.
[tests]
rent = false          # mbtcheck.h keeps file-static counters
reus = false

# ftpd_adr_parse() -- the shared SRVBIND/PASVBIND/PASVADR parser (#76).
# ftpd#adr.c is free of ftpd.h and of MVS services, so this is DUAL: it runs
# natively via `mbt test` and on MVS via `mbt test --mvs`.  The helper source is listed
# explicitly for the host link (no autocall there).
[test.TSTADR]
sources = ["test/tstadr.c", "src/ftpd#adr.c"]

# ftpd_ufs_rc_to_ftp() -- UFSD return code to FTP reply code (#151).  ftpd#urc.c
# is free of ftpd.h and of MVS services, so this is DUAL like TSTADR.
[test.TSTUER]
sources = ["test/tstuer.c", "src/ftpd#urc.c"]

# ftpd_list_nomem() -- a list builder's NULL with errno ENOMEM is a storage
# shortage, not an empty result (#118).  ftpd#lse.c is free of project and MVS
# headers, so this is DUAL like TSTADR.
[test.TSTLSE]
sources = ["test/tstlse.c", "src/ftpd#lse.c"]

# ftpd_pvp_open() -- the passive listener port walk: a port refused at listen()
# with EADDRINUSE is taken like one refused at bind() (#315).  ftpd#pvp.c is
# free of project and MVS headers, so this is DUAL like TSTADR.
[test.TSTPVP]
sources = ["test/tstpvp.c", "src/ftpd#pvp.c"]

# ftpd_dsn_valid() -- the data set name character check (#95).  Same shape as
# TSTADR: ftpd#dsn.c is free of ftpd.h and of MVS services, so this is DUAL.
[test.TSTDSN]
sources = ["test/tstdsn.c", "src/ftpd#dsn.c"]

# ftpd_ret_unexpired() -- does the DSCB's expiration date make OPEN for output
# ask the operator (IEC507D)?  STOR and APPE refuse with 550 instead (#198).
# ftpd#ret.c is free of project and MVS headers, so this is DUAL like TSTDSN.
# ftpd_lmp_split() -- LIST/NLST of DSN(pattern) (#302).
[test.TSTLMP]
sources = ["test/tstlmp.c", "src/ftpd#lmp.c", "src/ftpd#dsn.c"]

# ftpd_lvl_of() and ftpd_dsn_match() -- the catalog level LIST/NLST read for a
# name or pattern, and the filter over what it returns (#331).  ftpd#lvl.c is
# free of project and MVS headers, so this is DUAL like TSTLMP.
[test.TSTLVL]
sources = ["test/tstlvl.c", "src/ftpd#lvl.c", "src/ftpd#dsn.c"]

[test.TSTRET]
sources = ["test/tstret.c", "src/ftpd#ret.c"]

# ftpd_abd_dd_state() -- is the DD of an abandoned transfer
# still in the TIOT?  FTPD076W says "DD STILL HELD" only when it is (#232).
# ftpd#abd.c is free of project and MVS headers, so this is DUAL like TSTRET.
[test.TSTABD]
sources = ["test/tstabd.c", "src/ftpd#abd.c"]

# ftpd_abc_text() -- the ABEND code in FTPD070E and FTPD077E: system or user,
# and none when the ESTAE was not created (#260).  ftpd#abc.c is free of
# project and MVS headers, so this is DUAL like TSTABD.
[test.TSTABC]
sources = ["test/tstabc.c", "src/ftpd#abc.c"]

# The same check against the real TIOT: an allocated DD is found, a freed one
# is not, and the FILE's own DD name is the one the TIOT lists (#232).
# MVS-only; the data set is a temporary one.
[test.TSTABT]
host = false
sources = ["test/tstabt.c", "src/ftpd#abd.c"]

# The case behind FTPD076W: a STOR into a PDS with a full directory ends in an
# SB14 in the CLOSE, recovery abandons the FILE, and the DD that is gone must not
# be reported as held (#232).  MVS-only: a real PDS and a real ABEND.  parm
# names the scratch PDS the test creates and deletes (see TSTPRM for why the
# HLQ is written out and why the name stays short).
[test.TSTABR]
host = false
parm = "IBMUSER.FTPD.TABR"
sources = ["test/tstabr.c", "src/ftpd#abd.c"]

# ftpd_rec_maxdata()/ftpd_rec_keep() -- how much of a text line one record
# holds, so STOR can refuse or truncate an overlong line instead of cutting it
# silently (#207).  ftpd#rec.c is free of project and MVS headers: DUAL.
[test.TSTREC]
sources = ["test/tstrec.c", "src/ftpd#rec.c"]

# ftpd_jfl_name()/ftpd_jfl_match() -- the JESSTATUS filter of the JES mode of
# LIST, RETR and DELE (#207).  ftpd#jfl.c is free of project and MVS headers:
# DUAL.
[test.TSTJFL]
sources = ["test/tstjfl.c", "src/ftpd#jfl.c"]

# ftpd_jid_valid() -- the shape of the job ID RETR and DELE in the JES mode
# hand to jesjob(): JOB, STC or TSU and five digits, checked before JES is
# touched (#267).  ftpd#jid.c is free of project and MVS headers: DUAL.
[test.TSTJID]
sources = ["test/tstjid.c", "src/ftpd#jid.c"]

# ftpd_jcd_is_job() -- which card of a submitted stream is the JOB statement
# that NOTIFY/USER/PASSWORD are injected behind: "//name JOB", not a comment
# card that contains the word (#277).  ftpd#jcd.c is free of project and MVS
# headers: DUAL.
[test.TSTJCD]
sources = ["test/tstjcd.c", "src/ftpd#jcd.c"]

# ftpd_jwn_check() and friends -- who may see, read and delete which job on
# the JES spool (#90): entity and component rules, ownership, the RACF return
# code to level table, the decision table, the SITE JESOWNER classification,
# output sanitizing and the log counters.  RACF is a stub.  ftpd#jwn.c is free
# of project and MVS headers: DUAL.
[test.TSTJWN]
sources = ["test/tstjwn.c", "src/ftpd#jwn.c"]

# ftpdcfg_load() -- a read error on DD:FTPDPRM must abandon the start (#119).
# MVS-only: the vector is a real BSAM wrong-length record, built here by
# allocating the same data set through two DDs that disagree about BLKSIZE,
# so there is nothing on the host to run it against.  ftpd#log.c comes along
# because ftpd#cfg.c logs; it needs no GRT anchor (logst() answers NULL and
# the callers fall back), so no main() is required.
#
# parm names the scratch data set the test creates and deletes.  mbt passes
# it to the program verbatim -- there is no $(MBT_MVS_HLQ) expansion here --
# so the HLQ is written out.
# Change it when running against a system where IBMUSER is not the runner --
# and keep it short: mbt puts parm on the EXEC card without wrapping, and a
# name long enough to push that card past column 71 produces JCL that fails
# with IEF629I INCORRECT USE OF APOSTROPHE instead of running the test.
[test.TSTPRM]
host = false
parm = "IBMUSER.FTPD.TPRM"
sources = ["test/tstprm.c", "src/ftpd#cfg.c", "src/ftpd#log.c",
           "src/ftpd#adr.c", "src/ftpd#ret.c"]

# ftpd_session_queue() -- a connection the worker pool refuses is answered
# 421 and released, session and socket both (#177).  MVS-only: real thread
# manager and loopback sockets.  The sources are the whole of src/ftpd#*.c
# because ftpd#ses.c reaches into the command layer; ftpd.c (main) is not in
# the glob.  parm is the loopback listen port.
[test.TSTQUE]
host = false
parm = "21771"
sources = ["test/tstque.c", "src/ftpd#*.c"]

# PASS on a server that is not program-authorized -- ftpd_auth_pass() and
# ftpd_session_recover() (#258).  MVS-only: the real session loop in a real
# worker, a loopback client, and an unauthorized task whose MODESET ABENDs.
# Every ftpd#*.c comes along, ftpd.c (main) does not.  parm is the loopback
# listen port.
[test.TSTPAS]
host = false
parm = "21772"
sources = ["test/tstpas.c", "src/ftpd#*.c"]

# ftpd_site_dispatch() -- SITE keywords and keyword values in any spelling
# (#189).  MVS-only: ftpd#sit.c includes ftpd.h and so the libc370 MVS
# headers.  The test replaces the two reply functions and the volume check,
# so it needs no socket, no UCB scan and no log anchor.
[test.TSTSIT]
host = false
sources = ["test/tstsit.c", "src/ftpd#sit.c", "src/ftpd#jfl.c",
           "src/ftpd#dsn.c", "src/ftpd#jwn.c"]

# ftpd_mvs_dcbmodel() -- SITE DCBDSN reads RECFM, LRECL and BLKSIZE of a
# model data set from its Format-1 DSCB (#180).  MVS-only: catalog and VTOC.
# The scratch data sets are PARM.FB, .VBA, .U and .PDS, created and deleted by
# the test; every ftpd#*.c comes along (ftpd#mvs.c reaches into most of them)
# and ftpd.c is not in the glob.  Keep parm short, see TSTPRM.
[test.TSTDCB]
host = false
parm = "IBMUSER.FTPD.TDCB"
sources = ["test/tstdcb.c", "src/ftpd#*.c"]

# ftpd_mvs_retr() -- the FILE stays reachable through sess->cur_file until
# fclose() has returned, so ABEND recovery can still abandon it and release
# fopen's DD when the CLOSE itself ABENDs (#233, as #223 for STOR).  MVS-only:
# the test includes ftpd#mvs.c with fclose() replaced, stubs the data
# connection and reads a real data set.  ftpd#log.c needs no GRT anchor here (see TSTPRM).
[test.TSTRCL]
host = false
sources = ["test/tstrcl.c", "src/ftpd#log.c",
           "src/ftpd#dsn.c", "src/ftpd#lmp.c", "src/ftpd#lvl.c",
           "src/ftpd#lse.c", "src/ftpd#rec.c", "src/ftpd#ret.c", "src/ftpd#xlt.c"]

# ── Dependencies ─────────────────────────────────────────
# Only ufsd is a declared dependency: libufs.h / libufs.a are ufsd-specific.
# The C runtime -- sockets, threads, JES2, RACF, dynalloc -- is libc370, the
# cc370 sysroot, pinned in [toolchain] above rather than declared here.
[dependencies]
"mvslovers/ufsd" = ">=1.5.2"

# ── Deploy (mbt deploy, the inner loop) ──────────────────
# `mbt deploy` RECEIVEs the LINKLIB XMIT into FTPD.DEV.LINKLIB, mbt's default
# <NAME>.DEV.LINKLIB, so there is no [deploy] table. One stable name means the
# STC procedure's STEPLIB can point at it once.
#
# NOT the installed library. FTPD.LINKLIB is what SMP installs into and what
# IEAAPF00 authorises; this one is the development target and deliberately
# separate, so a deploy cannot overwrite an installed release. Whether it is
# APF-authorised depends on the stand. Where it is not, a module deployed here
# is fetched key 8 and authorises itself through SVC 244 instead -- which
# means the AC(1) module-data trap (#101) does not fire on it; test that from
# FTPD.LINKLIB. On mvsdev it is: the deployed build started with FTPD008I
# AUTHORIZED BY LIBRARY (MODULE KEY 0) on 2026-10-13, so the trap is live
# there for a development build too. FTPD008I says which case applies.

# ── Distribution (SMP4 install package) ──────────────────
# Turns `mbt package` into an installable product, the same two transports
# ufsd ships with:
#
#   FTPD load module -> XMIT -> staging LKLIB -> SMP ++MOD -> FTPD.LINKLIB
#   samplib/         -> XMIT -> TSO RECEIVE            -> FTPD.SAMPLIB
#
# SMP *copies* the host-bound module rather than re-binding it (a COPY-style
# ++JCLIN is what says so), which is what keeps ac = 1 and the entry point
# exactly as ld370 set them. The sample library stays outside SMP: an MCS card
# ends at column 72 and FTPDPRM0 already has comment lines past it, so a
# configuration pattern would have to answer to a delivery mechanism.
#
# Every value is a dataset name; the ddname SMP addresses it by is always the
# last qualifier, so LINKLIB, SAMPLIB, FTPDLOAD and AFTPDLOD fall out of the
# names.
#
# THE NAMES CARRY NO VERSION (#121), and that inverts how an upgrade works.
# They used to expand @VRM@ to the *patch* level -- FTPD.V1R0M2.LINKLIB for
# 1.0.2 -- while the FMID moved per minor, so two releases never collided on
# their libraries, only on the FMID. That is why a patch install needed UCLIN
# to free the id, and why the uninstall job's DELETE step was a trap: it named
# the PREDECESSOR's datasets, and running it scratched libraries nobody was
# using while the live installation stood untouched, with SMP reporting
# accepted throughout.
#
# With one set of names there is one installation, and the two can no longer
# drift apart. The cost is that the libraries now DO collide: the alloc job is
# IEFBR14 with DISP=(NEW,CATLG,DELETE) and will not run twice, so an upgrade is
# a clean cut -- RESTORE + REJECT the old FMID, scratch the libraries, allocate,
# install. The template already described that as the way to start over; it is
# now the ordinary path. In exchange the DELETE step means what it says, and
# nobody has to work out which release a dataset name belongs to.
#
# Stop the started task before replacing the load library. It is the one FTPD
# loads from.
[distribution]
# Shipped verbatim as the archive's README.md, so its links to other files in
# this repository are absolute and pinned to the release tag (blob/vX.Y.Z/...):
# a blob/main/ link breaks as soon as main moves the file. Bump the tag in
# those links when preparing each release.
readme = "docs/installation.md"

[smp]
# One FMID per release, spent exactly once: the id *is* the release, not the
# minor level. 1.0.0 through 1.0.2 were TFTP100 (the policy before this one);
# 1.1.0 was TFTP110; 1.2.0 was TFTP120 (released 2026-10-13); 1.3.0
# was TFTP130 (released 2026-10-22); 1.3.1 was TFTP131 (released 2026-10-27) and
# 1.3.2 was TFTP132 (released 2026-10-28), patch releases cut on the branch
# release-1.3.x with an explicit fmid, each deleting its predecessor only
# (TFTP130, then TFTP131). 1.3.3 is cut from main as a patch release the same
# way: main is 1.3.3-dev and carries the explicit fmid TFTP133 deleting TFTP132
# below, because mbt does not derive a patch id. TFTP140 stays reserved for
# 1.4.0, which will need an explicit delete that names TFTP133 (and TFTP132,
# TFTP131 and TFTP130 for a system that skipped a patch), or TFTP133 keeps the
# modules. A development build of main packaged before 1.3.3-dev carries
# TFTP140. TFTP111 was assigned to a
# 1.1.1 that was never cut -- the libc370 2.0 port made the next release 1.2.0
# -- and is unspent and unassigned. CLAUDE.md carries the rule, including the
# one that constrains versioning itself: a 7-character id has room for three
# version digits, so no component may ever exceed 9 -- ftpd 1.2.10 cannot be
# expressed and must not be released.
#
# `delete` is what makes a successor installable at all. SMP keys element
# ownership on MOD(name) in the CDS, not on the library the element lives in,
# so a SYSMOD that does not own MOD(FTPD) passes it over: "MOD FTPD NOT SEL"
# in one column of one report, nothing copied, and every condition code still
# reading success. Sighted here on 2026-09-13 (FTPDINS JOB00269) -- an empty
# FTPD.LINKLIB after a RECEIVE/APPLY/ACCEPT that was RC 00 from top to bottom.
# With DELETE, SMP deletes the predecessor's LMODs from the target and copies
# the new ones in, and MOD(FTPD) comes back carrying the new FMID. It replaces
# the hand-written UCLIN job that used to be required first (docs/uninstall.md).
#
# mbt derives both from `prefix` and [project] version: fmid = TFTP + major +
# minor + 0, delete = TFTP + major + (minor - 1) + 0 -- TFTP120 deleting
# TFTP110 for 1.2.0. Two cases need them written out. A patch release (1.2.1)
# needs an explicit `fmid` -- mbt refuses to spend the minor's id again -- and
# the release after it needs an explicit `delete`, because the derivation
# would name TFTP120 instead of the patch id it replaces. An x.0.0 needs an
# explicit `delete` too.
#
# A DELETE of an id the system never had is harmless -- which matters, because
# every 1.1.0 install carries DELETE(TFTP100), including the fresh ones. SMP4
# accepts it and installs normally: measured on mvsdev 2026-09-14 (TTMPINS
# JOB00309) with throwaway id TTMP112 deleting TTMP900, an id absent from both
# zones and from SMPPTS beforehand (TTMPCHK JOB00307). Every step ended COND
# CODE 0000, HMA2380 COPY SUCCESSFUL in the APPLY (TTMPLIB) and again in the
# ACCEPT (ATTMPLOD), and both libraries held the module afterwards (TTMPLST
# JOB00310). That is MVS/CE at HMASMP LVL 04.48; it was not re-run on TK5,
# which carries the same SMP4 level.
#
# Note the APPLY ends RC 00 here, not the RC 04 on HMA2461 that the
# upgrade path produces: with nothing to delete from the target there is no
# missing SMPSCDS backup entry to report. accept_fmid's relaxed ACCEPT gate is
# therefore only load-bearing on an upgrade, and merely harmless on a fresh
# install.
#
# It does leave a tombstone. The deleted id appears in *both* zones afterwards
# as "TYPE = FUNCTION" with "DELBY = <the new fmid>" and nothing else -- so
# after any 1.1.0 install, LIST CDS/ACDS SYSMOD(TFTP100) answers RC 00 with a
# DELBY line rather than RC 04 NOT FOUND, on a system that never ran 1.0.x.
# When checking whether an id is free, read the stanza and not just the RC: a
# bare DELBY is a tombstone, not an install. An uninstall should clear it with
# a plain DEL SYSMOD(<old>) in both zones, which works (TTMPCLN JOB00311 took
# TTMP900 back to NOT FOUND alongside TTMP112).
#
# TFTP120 was free on the maintainer's word (2026-10-01): the TFTP ids are
# assigned here and nowhere else, and he knows the systems. That was not a
# measurement -- no LIST CDS/ACDS SYSMOD(TFTP120) was run on any stand before
# 1.2.0 shipped under it. TFTP130, TFTP131, TFTP132, TFTP133 and TFTP140 are in the same state. If a check is run,
# record the stands and job numbers here, the way it was done for TFTP111
# below.
#
# TFTP111 was verified free before it was claimed, the same way TFTP110
# and TFTP100 were. LIST CDS and LIST ACDS SYSMOD(TFTP111) both answered "THE
# FOLLOWING SELECTED ENTRIES WERE NOT FOUND" with RC 04 on BOTH stands we can
# reach: mvsdev (MVS/CE, FMIDCHK JOB00332) and drnmig3a (TK5, FTPDCHK JOB00045),
# 2026-09-14. Name the stands, not just "checked" -- a collision can be
# distribution-specific (the E??nnnn note above, and the TMVS/TIST/TJES USERMODs
# that exist on MVS/CE and not on TK5), so one stand cannot establish that an id
# is free. drnmig3a has never carried an SMP-installed FTPD at all -- its
# FTPD.LINKLIB is a hand copy SMP knows nothing about, and TFTP110 is unknown in
# both of its zones too -- so this is a real absence and not an empty system.
#
# Residual: SYS1.SMPPTS was checked for TFTP members on mvsdev only. The PTS
# holds what was RECEIVEd, which a zone LIST does not show, so an id received
# and never applied on drnmig3a would still be missed.
#
# TFTP100 and TFTP110 are both spent and must never be reused. TFTP100 shipped
# with 1.0.0 through 1.0.2. TFTP110 shipped with 1.1.0 on 2026-09-14 -- and
# also with the build that was published and withdrawn the day before, which is
# the same id either way.
#
# A test install must use a throwaway id *and* throwaway module names. The
# ownership rule above is keyed on MOD(name), so a test package carrying the
# real module name fights the real install for that name whatever library it
# installs into. TTMP110 was that id on 2026-09-13 (FTPDINS JOB00269) and is
# spent: received, applied and accepted, then UCLIN'd back out. TTMP111 is
# spent the same way, from the second run that verified the upgrade path
# (FTPDINS JOB00281). TTMP112 and TTMP900 are spent from the fresh-install run
# above (2026-09-14, JOB00307-JOB00311). TFTP110 was verified still NOT FOUND
# in both zones after each (FINALCHK JOB00277, TTMPCLN JOB00283).
prefix = "TFTP"  # FMID and delete follow from the version
fmid = "TFTP133"       # a patch release: mbt does not derive it, and refuses to respend TFTP130
delete = ["TFTP132"]   # the patch id it replaces; the derivation would name TFTP120

# Empty despite the [dependencies] entry on ufsd, which is a *build* time one:
# libufs is linked statically, so nothing of ufsd has to be installed for FTPD
# to load. At run time it is soft -- ftpd_ufs_get() asks UFSD for a session
# lazily, per session, and answers 550 UFS service not available when the
# started task is not there. MVS data sets and JES are unaffected, which is
# most of what FTPD does. REQ(TUFS120) would therefore refuse the install on
# every system that does not run UFSD, for a facility that degrades on its own
# -- including both systems we test on, where LIST CDS/ACDS SYSMOD(TUFS120)
# answered RC 04 on 2026-08-13. ufsd's own prereq is empty for the same kind of
# reason: RAKF is a runtime dependency, not a SYSMOD one. The guide documents
# UFSD as an optional runtime prerequisite instead.
prereq = []

# Not optional with a DELETE in play: each zone is deleted by its own pass, so
# without the ACCEPT the CDS entry for TFTP100 goes and the ACDS one stays
# behind as REC APP ACC. It also makes this level the base a PTF RESTORE
# returns to, which is what it was here for before.
accept_fmid = true
lklib = "FTPD.FTPDLOAD"         # staging: what the load XMIT is received into
target = "FTPD.LINKLIB"         # where the load module ends up

[distribution.library.samplib]
target = "FTPD.SAMPLIB"
